<script>
const $=s=>document.querySelector(s);
const THEMES=['rose','ocean','emerald','sunset','violet','gold'];
const STAGES=['New Idea','Researching','Validating','Planning','Funding','Preparing to Launch','Launched','On Hold','Archived'];
const CH=['Social media','WhatsApp Business','Instagram','Facebook','TikTok','Referral','Word of mouth','Radio','Direct sales','Website','Events','Partnerships'];
const IND=['Agriculture','Food and beverages','Retail','Fashion','Beauty','Technology','Education','Health and wellness','Construction','Transport','Creative services','Professional services','Manufacturing','Tourism','Financial services','Other'];
let S;try{S=JSON.parse(localStorage.getItem('vn')||'null')}catch(e){}
S=S||{ideas:[],p:{theme:'emerald',mode:'system',cur:'GHS',splash:true}};
let view='home',cur=null,tab='Basics',toast='';
const save=()=>{try{localStorage.setItem('vn',JSON.stringify(S))}catch(e){}};
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const money=n=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:S.p.cur}).format(n)}catch(e){return S.p.cur+' '+n.toFixed(2)}};
const when=t=>new Date(t).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
function applyTheme(){const r=document.documentElement;r.dataset.theme=S.p.theme;const dark=S.p.mode==='dark'||(S.p.mode==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.mode=dark?'dark':'light';r.dataset.motion=(S.p.motion==='reduced'||(S.p.motion==='system'&&matchMedia('(prefers-reduced-motion:reduce)').matches))?'reduced':'full'}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* calculations */
function calc(i){const sum=(a,f)=>(a||[]).filter(f).reduce((s,x)=>s+num(x.amt),0);
 const startup=sum(i.budget,x=>x.type==='startup'),monthly=sum(i.budget,x=>x.type==='monthly');
 const conf=sum(i.fund,x=>x.status==='Confirmed'),prop=sum(i.fund,x=>x.status!=='Confirmed');
 const gap=Math.max(0,startup-conf);
 const rev=(i.rev||[]).reduce((s,r)=>s+num(r.price)*num(r.vol),0),vc=(i.rev||[]).reduce((s,r)=>s+num(r.vc)*num(r.vol),0);
 const profit=rev-vc-monthly;
 const units=(i.rev||[]).reduce((s,r)=>s+num(r.vol),0);const cm=units?(rev-vc)/units:0;
 const be=cm>0?monthly/cm:null;
 return{startup,monthly,conf,prop,gap,rev,vc,profit,be,margin:rev?profit/rev:0}}
const riskScore=r=>num(r.l)*num(r.i);
function parts(i){return[['Name',!!i.name],['Description',!!i.desc],['Industry',!!i.industry],['Big idea',!!(i.problem&&i.solution)],['Audience',!!i.audience],['Channels',(i.channels||[]).length>0],['Budget',(i.budget||[]).length>0],['Financing',(i.fund||[]).length>0],['Risks',(i.risks||[]).length>0],['Income',(i.rev||[]).length>0]]}
const pct=i=>{const p=parts(i);return Math.round(p.filter(x=>x[1]).length/p.length*100)};
function nextAction(i){const m=parts(i).find(x=>!x[1]);const t={'Description':'Add a short description','Industry':'Choose an industry','Big idea':'Write the problem and your solution','Audience':'Define your target customer','Channels':'Pick marketing channels','Budget':'Add your startup costs to find your funding gap','Financing':'Record how you will fund the business','Risks':'List your biggest risks','Income':'Add a revenue stream to forecast income'};
 const hi=(i.risks||[]).find(r=>riskScore(r)>=15&&!r.mit);if(hi&&!m)return'Add a mitigation plan to "'+hi.t+'"';return m?t[m[0]]||'Complete '+m[0]:'Review your plan and mark it ready to launch'}
function touch(i){i.edited=Date.now();save()}
/* views */
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',ideas:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/>',fin:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',more:'<circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',arr:'<path d="M5 12h14M13 6l6 6-6 6"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1 1-1.7 2.5-1.7s2.5.7 2.5 1.7-1 1.5-2.5 1.8-2.5.8-2.5 1.8 1 1.7 2.5 1.7 2.5-.7 2.5-1.7"/>',up:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>'};
IC.help='<circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .6c0 1.8-2.5 2.1-2.5 3.7M12 17v.5"/>';
const NAV=[['home','Home',IC.home],['ideas','Ideas',IC.ideas],['plan','Finance',IC.fin],['more','More',IC.more]];
const ico=p=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ring=p=>{const C=326.7;return`<svg class="ring" width="124" height="124" viewBox="0 0 120 120" role="img" aria-label="${p}% complete"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="11"/><circle class="v" cx="60" cy="60" r="52" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${(C*(1-p/100)).toFixed(1)}" transform="rotate(-90 60 60)"/><text x="60" y="67" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">${p}%</text></svg>`};
const donut=a=>{const T=a.reduce((t,x)=>t+x.v,0);if(!T)return'';let off=0;return`<svg viewBox="0 0 100 100" width="132" height="132" role="img" aria-label="Funding mix"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--sf2)" stroke-width="14"/>${a.filter(x=>x.v>0).map(x=>{const l=x.v/T*251.3,e=`<circle class="seg" cx="50" cy="50" r="40" fill="none" stroke="${x.c}" stroke-width="14" stroke-dasharray="${l.toFixed(1)} ${(251.3-l).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 50 50)"/>`;off+=l;return e}).join('')}</svg>`};
const leg=(c,l,v)=>`<div class="lg"><u style="background:${c}"></u><span>${l}</span><b>${money(v)}</b></div>`;
function cash(c){const p=[];for(let m=0;m<=12;m++)p.push(c.conf-c.startup+c.profit*m);const lo=Math.min(0,...p),hi=Math.max(0,...p),r=(hi-lo)||1,X=m=>10+m*(280/12),Y=v=>100-(v-lo)/r*88,d=p.map((v,m)=>(m?'L':'M')+X(m).toFixed(1)+' '+Y(v).toFixed(1)).join('');
 return`<svg viewBox="0 0 300 112" width="100%" role="img" aria-label="12 month cash outlook"><path d="${d}L290 ${Y(0).toFixed(1)}L10 ${Y(0).toFixed(1)}Z" fill="var(--ac)" opacity=".16"/><line x1="10" x2="290" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="var(--mut)" stroke-dasharray="3 4" opacity=".6"/><path class="wave" pathLength="1" d="${d}" fill="none" stroke="var(--ac)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><p class="note">Cash after month 12: <b>${money(p[12])}</b>. Projection that assumes your monthly figures stay steady. It is not actual cash.</p>`}
function cards(i){const c=calc(i),o=[];
 const it=(i.budget||[]).filter(x=>x.type==='startup').sort((a,b)=>num(b.amt)-num(a.amt)).slice(0,6);
 if(it.length){const mx=num(it[0].amt)||1;o.push(`<div class="card"><h3>Startup costs</h3><p class="note">Largest items in ${S.p.cur}</p><div class="bars">${it.map((x,n)=>`<div style="--n:${n}"><i style="height:${Math.round(num(x.amt)/mx*96)+8}px" title="${esc(x.d)}: ${money(num(x.amt))}"></i><em style="font-style:normal">${esc(x.d.slice(0,7))}</em></div>`).join('')}</div></div>`)}
 if(c.startup||c.conf||c.prop){const pr=Math.min(c.prop,Math.max(0,c.startup-c.conf)),un=Math.max(0,c.startup-c.conf-c.prop);o.push(`<div class="card fund">${donut([{v:c.conf,c:'var(--ok)'},{v:pr,c:'var(--ac)'},{v:un,c:'var(--warn)'}])}<div><h3>Funding</h3>${leg('var(--ok)','Confirmed',c.conf)}${leg('var(--ac)','Proposed (not cash yet)',c.prop)}${leg('var(--warn)','Still uncovered',un)}</div></div>`)}
 if(c.rev||c.monthly||c.startup)o.push(`<div class="card"><h3>12-month cash outlook</h3>${cash(c)}</div>`);
 return o}
const hello=()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'};
function home(){const L=S.ideas.filter(i=>i.stage!=='Archived');
 const tot=L.reduce((a,i)=>{const c=calc(i);a.s+=c.startup;a.r+=c.rev;return a},{s:0,r:0});
 const risks=L.reduce((n,i)=>n+(i.risks||[]).filter(r=>riskScore(r)>=15&&!r.mit).length,0);
 const last=[...L].sort((a,b)=>b.edited-a.edited)[0];
 const w=(ic,l,v,m)=>`<div class="card w"><i>${ico(ic)}</i><b data-cu="${v}" ${m?'data-m="1"':''}>${m?money(v):v}</b><span>${l}</span></div>`;
 const arrow=`<b>${ico(IC.arr)}</b>`;
 const hero=last?`<div class="hero"><div><small>Continue planning</small><h3>${esc(last.name||'Untitled idea')}</h3><p>Next: ${esc(nextAction(last))}</p><button class="go w" data-a="open" data-id="${last.id}">${arrow}<span>Continue</span></button></div>${ring(pct(last))}</div>`
 :`<div class="hero"><div><small>Start here</small><h3>Plant your first idea</h3><p>A name and one sentence is enough. You can grow the rest later.</p><button class="go w" data-a="new">${arrow}<span>Create business idea</span></button></div><svg class="sway" width="92" height="92" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 58V30" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M32 34C32 21 21 14 10 17c0 13 9 19 22 17zM32 30c0-11 9-17 22-15 0 13-9 19-22 15z" fill="#fff" opacity=".92"/></svg></div>`;
 return`<div class="top"><div><small>${hello()}</small><h2>${esc(S.p.name||'there')}</h2></div><button class="rb" data-a="tour" aria-label="Show me how this screen works">${ico(IC.help)}</button></div>${hero}
 <div class="wg">${w(IC.ideas,'Business ideas',L.length)}${w(IC.coin,'Estimated startup need',tot.s,1)}${w(IC.up,'Projected monthly revenue',tot.r,1)}${w(IC.warn,'High risks without a plan',risks)}</div>
 ${last?cards(last).join(''):''}
 ${last&&!cards(last).length?`<div class="card empty">Add costs, funding or revenue to <b>${esc(last.name||'your idea')}</b> and charts will grow here.</div>`:''}
 ${L.length?`<div class="card"><h3>Next actions</h3><div class="tl">${L.slice(0,4).map(i=>`<button class="ev" data-a="open" data-id="${i.id}"><u></u><div><b>${esc(i.name||'Untitled idea')}</b><span>${esc(nextAction(i))}</span></div></button>`).join('')}</div></div>`:''}`}
function ideas(){return`<h2>My Ideas</h2>`+(S.ideas.length?S.ideas.map(i=>`<div class="card fade"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(i.name||'Untitled idea')}</h3><span class="badge">${esc(i.stage)}</span></div><p class="note">${esc(i.industry||'No industry yet')} · ${esc(i.desc||'No description yet')}</p><div class="bar"><i style="width:${pct(i)}%"></i></div><p class="note">${pct(i)}% complete · edited ${when(i.edited)}</p><button class="btn sm" data-a="open" data-id="${i.id}">Open plan</button> <button class="btn sm del" data-a="del" data-id="${i.id}">Delete</button></div>`).join(''):`<div class="card empty">Nothing here yet.<br><br><button class="btn" data-a="new">Create business idea</button></div>`)+`<button class="btn" data-a="new">New idea</button>`}
const f=(k,l,v,t='text',ex='')=>`<label>${l}<input data-k="${k}" type="${t}" value="${esc(v)}" ${ex}></label>`;
const ta=(k,l,v,ph='')=>`<label>${l}<textarea data-k="${k}" placeholder="${ph}">${esc(v)}</textarea></label>`;
function detail(){const i=S.ideas.find(x=>x.id===cur);if(!i){view='ideas';return ideas()}
 const T=['Basics','Big idea','Audience','Channels','Budget','Financing','Risks','Income','Summary'];
 let b='';
 if(tab==='Basics')b=f('name','Business name',i.name)+f('tag','Tagline (optional)',i.tag)+ta('desc','Short description',i.desc)+f('loc','Location / market',i.loc)+`<label>Industry<select data-k="industry"><option value="">Choose…</option>${IND.map(x=>`<option ${i.industry===x?'selected':''}>${x}</option>`).join('')}</select></label>`+`<label>Business model<select data-k="model">${['','B2C (sell to consumers)','B2B (sell to businesses)','Service-based','Product sales','Subscription','Online-only','Physical location','Hybrid'].map(x=>`<option ${i.model===x?'selected':''}>${x}</option>`).join('')}</select></label>`+`<label>Stage<select data-k="stage">${STAGES.map(x=>`<option ${i.stage===x?'selected':''}>${x}</option>`).join('')}</select></label>`+f('launch','Target launch date',i.launch,'date');
 if(tab==='Big idea')b=ta('problem','What problem does it solve?',i.problem,'e.g. Fresh produce is hard to find nearby')+ta('solution','How does your solution work?',i.solution)+ta('diff','What makes it different?',i.diff)+ta('assume','Assumptions still to validate',i.assume,'These are unconfirmed until you test them')+(i.problem&&i.solution?`<div class="card" style="background:var(--sf2)"><h3>Problem → Solution</h3><p><b>Problem:</b> ${esc(i.problem)}</p><p><b>Solution:</b> ${esc(i.solution)}</p></div>`:'');
 if(tab==='Audience')b=ta('audience','Primary customers',i.audience,'Who are they, where, what do they need?')+ta('compet','Competitors or alternatives',i.compet)+ta('evid','Evidence for these assumptions',i.evid,'Interviews, surveys, observations. Leave blank if none yet.')+`<p class="note">Treat anything without evidence as an assumption.</p>`;
 if(tab==='Channels')b=`<p class="note">Marketing channels</p><div style="display:flex;flex-wrap:wrap;gap:6px">${CH.map(c=>`<button class="btn sm ${(i.channels||[]).includes(c)?'':'ghost'}" data-a="ch" data-v="${c}">${c}</button>`).join('')}</div>`+f('custom','Add custom channel','')+`<button class="btn sm ghost" data-a="addch">Add channel</button>`+f('src','Where did this idea come from? (source)',i.src,'text','placeholder="Personal experience, customer feedback…"');
 if(tab==='Budget'){const c=calc(i);b=`<div class="row"><div class="stat"><b>${money(c.startup)}</b><span>Startup total</span></div><div class="stat"><b>${money(c.monthly)}</b><span>Monthly operating</span></div><div class="stat"><b>${money(c.monthly*12)}</b><span>Annual operating</span></div></div>`+list(i,'budget',['d','Item'],['amt','Amount'],'type',[['startup','Startup'],['monthly','Monthly']])}
 if(tab==='Financing'){const c=calc(i);b=`<div class="row"><div class="stat"><b>${money(c.startup)}</b><span>Needed</span></div><div class="stat"><b>${money(c.conf)}</b><span>Confirmed</span></div><div class="stat"><b>${money(c.prop)}</b><span>Proposed (not cash yet)</span></div><div class="stat"><b>${money(c.gap)}</b><span>Funding gap</span></div></div>`+list(i,'fund',['d','Source'],['amt','Amount'],'status',[['Proposed','Proposed'],['Confirmed','Confirmed']])+`<p class="note">Loans are borrowed capital, not revenue. Eligibility is never guaranteed.</p>`}
 if(tab==='Risks'){b=(i.risks||[]).map((r,n)=>{const s=riskScore(r),col=s>=15?'var(--bad)':s>=8?'var(--warn)':'var(--ok)';return`<div class="card"><span class="sev" style="background:${col}">${s}</span> <b>${esc(r.t)}</b> <span class="note">likelihood ${r.l} × impact ${r.i}</span><label>Mitigation plan<input data-rk="${n}" value="${esc(r.mit)}"></label>${s>=15&&!r.mit?'<p class="note">Next step: write a mitigation plan.</p>':''}<button class="btn sm del" data-a="rdel" data-v="${n}">Remove</button></div>`}).join('')||'<div class="empty">No risks recorded.</div>';
  b+=`<div class="card"><h3>Add risk</h3>${f('rt','Risk title','')}<div class="row"><label>Likelihood (1–5)<input id="rl" type="number" min="1" max="5" value="3"></label><label>Impact (1–5)<input id="ri" type="number" min="1" max="5" value="3"></label></div><button class="btn sm" data-a="radd">Add risk</button><p class="note">Score = likelihood × impact. It is a planning aid, not a prediction.</p></div>`}
 if(tab==='Income'){const c=calc(i);b=(i.rev||[]).map((r,n)=>`<div class="card"><b>${esc(r.n)}</b> <span class="note">${money(num(r.price))} × ${num(r.vol)}/month, variable cost ${money(num(r.vc))}/unit</span> <button class="btn sm del" data-a="vdel" data-v="${n}">Remove</button></div>`).join('')||'<div class="empty">Add a product or service to see a forecast.</div>';
  b+=`<div class="card"><h3>Add revenue stream</h3>${f('vn','Product or service','')}<div class="row"><label>Price<input id="vp" type="number" min="0" step="any"></label><label>Units per month<input id="vv" type="number" min="0" step="any"></label><label>Variable cost/unit<input id="vc" type="number" min="0" step="any"></label></div><button class="btn sm" data-a="vadd">Add stream</button></div>`;
  if((i.rev||[]).length)b+=`<div class="card tbl"><h3>Monthly projection</h3><table><tr><td>Revenue</td><td>${money(c.rev)}</td></tr><tr><td>Variable costs</td><td>${money(c.vc)}</td></tr><tr><td>Fixed operating costs (from Budget)</td><td>${money(c.monthly)}</td></tr><tr><td><b>Operating profit</b></td><td><b style="color:${c.profit>=0?'var(--ok)':'var(--bad)'}">${money(c.profit)}</b></td></tr><tr><td>Margin</td><td>${(c.margin*100).toFixed(1)}%</td></tr><tr><td>Break-even volume</td><td>${c.be==null?'Not reachable at these prices':Math.ceil(c.be)+' units/month'}</td></tr></table><p class="note">Projection based on your inputs only; not actual income or a guarantee. Revenue is not profit.</p></div>`+scen(i)}
 if(tab==='Summary'){const c=calc(i);b=`<h3>Completeness ${pct(i)}%</h3><div class="bar"><i style="width:${pct(i)}%"></i></div><p class="note">Score = filled sections out of ${parts(i).length}. It shows how complete the plan is, not whether the business will succeed.</p><p>${parts(i).map(p=>`${p[1]?'✅':'⬜'} ${p[0]}`).join(' &nbsp; ')}</p><p><b>Next action:</b> ${esc(nextAction(i))}</p><p class="note">Created ${when(i.created)} · Last edited ${when(i.edited)}</p><button class="btn" data-a="txt">Download text summary</button> <button class="btn ghost" data-a="exp1">Export this idea (JSON)</button> <button class="btn del" data-a="del" data-id="${i.id}">Delete idea</button>`}
 return`<button class="btn sm ghost" data-a="back">← My Ideas</button><h2 style="margin-top:10px">${esc(i.name||'Untitled idea')}</h2><div class="tabs">${T.map(t=>`<button class="btn sm ${t===tab?'':'ghost'}" data-a="tab" data-v="${t}">${t}</button>`).join('')}</div><div class="card fade">${b}</div>`}
function list(i,key,a,b2,sel,opts){const rows=(i[key]||[]).map((x,n)=>`<tr><td>${esc(x.d)}</td><td>${money(num(x.amt))}</td><td>${esc(x[sel])}</td><td><button class="btn sm del" data-a="ldel" data-key="${key}" data-v="${n}">✕</button></td></tr>`).join('');
 return`<div class="tbl"><table>${rows||'<tr><td class="empty">No entries yet</td></tr>'}</table></div><div class="row"><label>${a[1]}<input id="ld"></label><label>${b2[1]}<input id="la" type="number" min="0" step="any"></label><label>Type<select id="ls">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></label></div><button class="btn sm" data-a="ladd" data-key="${key}" data-sel="${sel}">Add</button>`}
function scen(i){const c=calc(i),sc=[['Conservative',i.sv?.[0]??70,i.sp?.[0]??95],['Expected',100,100],['Optimistic',i.sv?.[2]??130,i.sp?.[2]??105]];
 return`<div class="card tbl"><h3>Scenarios</h3><p class="note">Edit the volume and price % for each scenario. They are your assumptions, not predictions.</p><table><tr><th></th><th>Volume %</th><th>Price %</th><th>Profit/month</th></tr>${sc.map((s,n)=>{const rev=(i.rev||[]).reduce((t,r)=>t+num(r.price)*s[2]/100*num(r.vol)*s[1]/100,0),vc=(i.rev||[]).reduce((t,r)=>t+num(r.vc)*num(r.vol)*s[1]/100,0),p=rev-vc-c.monthly;return`<tr><td>${s[0]}</td><td>${n==1?100:`<input data-sc="v${n}" type="number" value="${s[1]}" style="width:80px">`}</td><td>${n==1?100:`<input data-sc="p${n}" type="number" value="${s[2]}" style="width:80px">`}</td><td style="color:${p>=0?'var(--ok)':'var(--bad)'}">${money(p)}</td></tr>`}).join('')}</table></div>`}
function more(){return`<h2>More</h2>${prof()}<div class="card"><h3>Theme</h3><div class="sw">${THEMES.map(t=>`<button class="${S.p.theme===t?'on':''}" data-a="theme" data-v="${t}"><i style="background:hsl(${({rose:340,ocean:205,emerald:150,sunset:18,violet:265,gold:42})[t]} 75% 55%)"></i>${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
 <label>Appearance<select data-p="mode">${['system','light','dark'].map(m=>`<option ${S.p.mode===m?'selected':''}>${m}</option>`).join('')}</select></label>
 <label>Currency<select data-p="cur">${['GHS','USD','EUR','GBP','NGN','KES','ZAR','XOF','CAD','AUD'].map(m=>`<option ${S.p.cur===m?'selected':''}>${m}</option>`).join('')}</select></label>
 <label><input type="checkbox" data-p="splash" ${S.p.splash?'checked':''} style="width:auto;min-height:0"> Show the welcome animation on launch</label><label>Animations<select data-p="motion">${[['full','Full'],['system','Follow phone setting'],['reduced','Reduced']].map(([k,l])=>`<option value="${k}" ${(S.p.motion||'full')===k?'selected':''}>${l}</option>`).join('')}</select></label></div>
 <div class="card"><h3>Backup and restore</h3><p class="note">Your plans are stored only in this browser on this device. They do not sync and are not encrypted. Clearing browser data or removing the app can delete them, so export a backup regularly.</p><button class="btn" data-a="exp">Export all (JSON)</button> <label class="btn ghost" style="display:inline-block;margin:0">Import backup<input type="file" accept=".json" id="imp" style="display:none"></label><p class="note">Import merges: ideas with a new id are added, matching ids are skipped.</p></div>
 <div class="card"><h3>Help</h3><p class="note">Create an idea, then work through the tabs: Basics, Big idea, Audience, Channels, Budget, Financing, Risks, Income. Everything saves as you go. Totals are calculated from your entries only. Projections are estimates, not guarantees, and nothing here is legal or financial advice.</p><button class="btn ghost" data-a="tour">Replay the tour</button> <button class="btn del" data-a="wipe">Delete all data</button></div>`}
let fresh=true,first=true;
function render(){applyTheme();const v=view==='detail'?detail():view==='ideas'?ideas():view==='more'?more():view==='plan'?plan():home();
 const a=$('#app');a.className=fresh?'st':'';a.innerHTML=v+(toast?`<p class="note">${toast}</p>`:'');
 [...a.children].forEach((c,n)=>c.style.setProperty('--i',n));a.querySelectorAll('.ev,.lg').forEach(e=>e.style.setProperty('--n',[...e.parentNode.children].indexOf(e)));a.querySelectorAll('.wg>.card').forEach((c,n)=>c.style.setProperty('--i',n+2));
 const nv=$('#nav');if(!nv.firstChild)nv.innerHTML=NAV.map(([k,l,p])=>`<button data-nav="${k}" aria-label="${l}">${ico(p)}<span>${l}</span></button>`).join('');
 const act=view==='detail'?'ideas':view;nv.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.nav===act));
 if(fresh&&document.documentElement.dataset.motion!=='reduced')a.querySelectorAll('[data-cu]').forEach(el=>{const to=+el.dataset.cu,m=el.dataset.m,t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-k,3);el.textContent=m?money(to*e):Math.round(to*e);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
 try{const hs=history.state;if(fresh&&!(hs&&hs.view===view&&hs.cur===cur&&hs.tab===tab))history.pushState({view,cur,tab},'')}catch(e){}
 const me=$('#me');if(me)me.innerHTML=avInner();const tb=a.querySelector('.tabs'),on=tb&&tb.querySelector('.btn:not(.ghost)');if(on)tb.scrollTo({left:on.offsetLeft-tb.clientWidth/2+on.clientWidth/2,behavior:'smooth'});if(fresh&&!first)window.scrollTo(0,0);first=false;fresh=false}
function plan(){const L=S.ideas;if(!L.length)return`<h2>Finance</h2><div class="card empty">Create an idea to see its numbers here.</div>`;
 return`<h2>Finance</h2>`+L.map(i=>{const c=cards(i);return`<div class="card"><h3>${esc(i.name||'Untitled idea')}</h3><p class="note">${c.length?'Charts below use only what you entered.':'Add costs, funding or revenue to see charts.'}</p><button class="btn sm" data-a="open" data-id="${i.id}">Open plan</button></div>`+c.join('')}).join('')}
/* events */
function dl(name,txt,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const cu=()=>S.ideas.find(x=>x.id===cur);
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){view=n.dataset.nav;fresh=true;toast='';render();return}
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v,i=cu();fresh=['new','open','back','tab'].includes(a);
 if(a==='new'){const x={id:uid(),name:'',stage:'New Idea',created:Date.now(),edited:Date.now(),channels:[],budget:[],fund:[],risks:[],rev:[]};S.ideas.unshift(x);cur=x.id;tab='Basics';view='detail';save()}
 else if(a==='open'){cur=el.dataset.id;tab='Basics';view='detail'}
 else if(a==='back')view='ideas';else if(a==='tab')tab=v;
 else if(a==='del'){delIdea(el.dataset.id);return}
 else if(a==='tour'){tour();return}
 else if(a==='rmpic'){S.p.photo='';save()}
 else if(a==='ch'){const c=i.channels,k=c.indexOf(v);k<0?c.push(v):c.splice(k,1);touch(i)}
 else if(a==='addch'){const t=$('[data-k=custom]').value.trim();if(t&&!i.channels.includes(t)){i.channels.push(t);touch(i)}}
 else if(a==='ladd'){const d=$('#ld').value.trim(),m=num($('#la').value);if(!d||m<=0){toast='Enter a name and an amount above zero.';render();return}i[el.dataset.key].push({d,amt:m,[el.dataset.sel]:$('#ls').value});toast='';touch(i)}
 else if(a==='ldel'){i[el.dataset.key].splice(+v,1);touch(i)}
 else if(a==='radd'){const t=$('[data-k=rt]').value.trim(),l=Math.min(5,Math.max(1,num($('#rl').value))),im=Math.min(5,Math.max(1,num($('#ri').value)));if(!t){toast='Give the risk a title.';render();return}i.risks.push({t,l,i:im,mit:''});toast='';touch(i)}
 else if(a==='rdel'){i.risks.splice(+v,1);touch(i)}
 else if(a==='vadd'){const n=$('[data-k=vn]').value.trim(),p=num($('#vp').value),q=num($('#vv').value);if(!n||p<=0||q<=0){toast='Enter a name, a price and a volume above zero.';render();return}i.rev.push({n,price:p,vol:q,vc:num($('#vc').value)});toast='';touch(i)}
 else if(a==='vdel'){i.rev.splice(+v,1);touch(i)}
 else if(a==='theme'){S.p.theme=v;save()}
 else if(a==='exp')dl('venturenest-backup.json',JSON.stringify({app:'VentureNest',version:1,exported:new Date().toISOString(),ideas:S.ideas},null,2));
 else if(a==='exp1')dl((i.name||'idea')+'.json',JSON.stringify({app:'VentureNest',version:1,exported:new Date().toISOString(),ideas:[i]},null,2));
 else if(a==='txt'){const c=calc(i);dl((i.name||'idea')+'.txt',`${i.name}\n${i.tag||''}\n\n${i.desc||''}\nIndustry: ${i.industry||'-'}\nStage: ${i.stage}\n\nProblem: ${i.problem||'-'}\nSolution: ${i.solution||'-'}\nAudience: ${i.audience||'-'}\nChannels: ${i.channels.join(', ')||'-'}\n\nStartup (estimate): ${money(c.startup)}\nMonthly costs (estimate): ${money(c.monthly)}\nConfirmed funding: ${money(c.conf)}\nFunding gap: ${money(c.gap)}\nProjected monthly revenue (projection): ${money(c.rev)}\nProjected monthly profit (projection): ${money(c.profit)}\n`,'text/plain')}
 else if(a==='wipe'){wipeAll();return}
 render()});
document.addEventListener('change',e=>{const t=e.target,i=cu();
 if(t.dataset.k&&i&&!['custom','rt','vn'].includes(t.dataset.k)){i[t.dataset.k]=t.value;touch(i);toast='Saved';render();setTimeout(()=>{toast='';},1500)}
 else if(t.dataset.rk!==undefined){i.risks[+t.dataset.rk].mit=t.value;touch(i);render()}
 else if(t.dataset.sc){const k=t.dataset.sc,n=+k[1];i.sv=i.sv||[70,100,130];i.sp=i.sp||[95,100,105];(k[0]==='v'?i.sv:i.sp)[n]=num(t.value);touch(i);render()}
 else if(t.dataset.p){S.p[t.dataset.p]=t.type==='checkbox'?t.checked:t.value;save();render()}
 else if(t.id==='pic'){readPic(t.files[0],d=>{if(d){S.p.photo=d;save();render()}})}
 else if(t.id==='imp'){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='VentureNest'||!Array.isArray(d.ideas))throw 0;let n=0;d.ideas.forEach(x=>{if(x&&x.id&&typeof x==='object'&&!S.ideas.some(y=>y.id===x.id)){x.channels=x.channels||[];x.budget=x.budget||[];x.fund=x.fund||[];x.risks=x.risks||[];x.rev=x.rev||[];S.ideas.push(x);n++}});save();toast=`Imported ${n} idea(s); duplicates skipped.`}catch(_){toast='That file is not a valid VentureNest backup. Nothing was changed.'}render()};r.readAsText(t.files[0])}});
/* profile, dialogs, tour */
const initial=()=>(S.p.name||'?').trim().charAt(0).toUpperCase();
const avInner=()=>S.p.photo?`<img src="${S.p.photo}" alt="">`:esc(initial());
const prof=()=>`<div class="card"><h3>Profile</h3><div class="fund"><label for="pic" class="pv" aria-label="Change photo">${avInner()}</label><input id="pic" type="file" accept="image/*" hidden><div><label>Your name<input data-p="name" maxlength="30" value="${esc(S.p.name)}"></label><p><label for="pic" class="btn sm ghost" style="display:inline-block;margin:0">${S.p.photo?'Change photo':'Add photo (optional)'}</label> ${S.p.photo?'<button class="btn sm del" data-a="rmpic">Remove photo</button>':''}</p></div></div></div>`;
function readPic(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=192;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,192,192);cb(c.toDataURL('image/jpeg',.8))};im.onerror=()=>cb(null);im.src=r.result};r.readAsDataURL(f)}
function modal(h){const m=document.createElement('div');m.className='mo';m.innerHTML=`<div class="mc" role="dialog" aria-modal="true">${h}</div>`;document.body.appendChild(m);return m}
function ask(t,msg,ok){return new Promise(res=>{const m=modal(`<h3>${t}</h3><p>${msg}</p><div class="mb"><button class="btn ghost" data-r="0">Cancel</button><button class="btn dg" data-r="1">${ok}</button></div>`);m.querySelector('[data-r="0"]').focus();m.onclick=e=>{const b=e.target.closest('[data-r]');if(!b&&e.target!==m)return;m.remove();res(!!b&&b.dataset.r==='1')}})}
async function delIdea(id){const i=S.ideas.find(x=>x.id===id);if(!await ask('Delete idea?',`Delete <b>${esc((i&&i.name)||'this idea')}</b> with all its budget, funding, risk and income entries?`,'Yes, continue'))return;if(!await ask('Are you absolutely sure?','This cannot be undone. Export the idea first if you want a copy.','Delete permanently'))return;S.ideas=S.ideas.filter(x=>x.id!==id);if(cur===id){cur=null;view='ideas'}save();fresh=true;render()}
async function wipeAll(){if(!await ask('Delete all data?','This removes every idea, your profile and your settings from this device.','Yes, continue'))return;if(!await ask('Last check','Everything will be erased permanently. Export a backup first if you might need it.','Delete everything'))return;S={ideas:[],p:{theme:'emerald',mode:'system',cur:'GHS',splash:true}};save();view='home';cur=null;fresh=true;render();startup()}
function setup(done){let pic='';const m=modal(`<h3>Welcome to VentureNest</h3><p>What should we call you?</p><div class="fund"><label for="spic" class="pv" id="spv" aria-label="Choose photo">+</label><input id="spic" type="file" accept="image/*" hidden><span class="note">Profile photo<br>(optional)</span></div><label>Your name<input id="sn" maxlength="30" autocomplete="given-name"></label><p class="note" id="se" role="alert"></p><div class="mb"><button class="btn" id="sg">Continue</button></div>`);
 m.querySelector('#spic').onchange=e=>readPic(e.target.files[0],d=>{if(d){pic=d;m.querySelector('#spv').innerHTML=`<img src="${d}" alt="">`}});
 m.querySelector('#sg').onclick=()=>{const n=m.querySelector('#sn').value.trim();if(!n){m.querySelector('#se').textContent='Please enter your name to continue.';return}S.p.name=n;S.p.photo=pic;save();m.remove();fresh=false;render();done()}}
const TOUR=[{s:'#me',t:'Your profile',d:'Your picture and name live here. Tap it to change them, switch theme, or manage backups.'},{s:'.hero .go',t:'Start an idea',d:'Create a business idea here, or continue the one you were last working on.'},{s:'nav [data-nav=ideas]',t:'My Ideas',d:'Open an idea to work through its tabs: Basics, Big idea, Audience, Channels, Budget, Financing, Risks, Income and Summary. The tab bar stays pinned at the top while you scroll.'},{s:'nav [data-nav=plan]',t:'Finance',d:'Charts for startup costs, funding and cash, built only from the numbers you enter.'},{s:'nav [data-nav=more]',t:'More',d:'Themes, light or dark, currency, backups and restore, delete data, and this tour again.'},{s:'.top .rb',t:'Need help?',d:'Tap the ? on the home screen any time to replay this tour.'}];
function tour(){if(view!=='home'){view='home';fresh=true;render()}
 setTimeout(()=>{let n=0;const o=document.createElement('div');o.className='tour';o.innerHTML='<div class="hole"></div><div class="tip"></div>';document.body.appendChild(o);
 const end=()=>{o.remove();S.p.toured=true;save()};
 const show=()=>{const st=TOUR[n],el=document.querySelector(st.s),h=o.querySelector('.hole'),tp=o.querySelector('.tip');let r=null;
  if(el){r=el.getBoundingClientRect();h.style.cssText=`left:${r.left-8}px;top:${r.top-8}px;width:${r.width+16}px;height:${r.height+16}px`}else h.style.cssText='left:50%;top:50%;width:0;height:0;outline:0';
  tp.style.top=tp.style.bottom='auto';if(r&&r.top>innerHeight*.5)tp.style.bottom=(innerHeight-r.top+20)+'px';else tp.style.top=(r?r.bottom+20:innerHeight*.3)+'px';
  tp.innerHTML=`<h3>${st.t}</h3><p>${st.d}</p><div class="mb" style="justify-content:space-between;align-items:center"><span class="note">${n+1} of ${TOUR.length}</span><span><button class="btn ghost sm" data-t="s">Skip</button> <button class="btn sm" data-t="n">${n===TOUR.length-1?'Done':'Next'}</button></span></div>`};
 o.onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;if(b.dataset.t==='s'||n===TOUR.length-1)end();else{n++;show()}};show()},1100)}
function startup(){const t=()=>{if(!S.p.toured)tour()};if(!S.p.name)setup(t);else t()}
addEventListener('scroll',e=>{const t=e.target===document?document.documentElement:e.target;if(!t||!t.classList)return;t.classList.add('sb');clearTimeout(t._sb);t._sb=setTimeout(()=>t.classList.remove('sb'),900)},true);
(function(){const sp=document.getElementById('sparks');if(!sp)return;for(let n=0;n<20;n++){const a=Math.random()*Math.PI*2,d=45+Math.random()*80,e=document.createElement('i');e.style.cssText=`--x:${Math.cos(a)*d|0}px;--y:${Math.sin(a)*d|0}px;--s:${7+Math.random()*10|0}px;animation-delay:${2.5+Math.random()*.3}s`;if(n%4===0)e.className='o';sp.appendChild(e)}})();
/* launch */
try{history.replaceState({view:'home',cur:null,tab:'Basics'},'')}catch(e){}
addEventListener('popstate',e=>{const h=e.state;if(h){view=h.view;cur=h.cur;tab=h.tab;fresh=true;render()}});
applyTheme();render();
const sp=$('#splash'),go=()=>{fresh=true;render();startup();$('#nav').classList.add('navin');$('#bar').classList.add('in')};
if(S.p.splash){setTimeout(()=>{sp.style.opacity=0;go();setTimeout(()=>sp.remove(),600)},3900)}else{sp.remove();go()}
</script></body></html>
